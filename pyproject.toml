[project]
name = "jellyfin-utils"
version = "0.1.0"
description = "Jellyfin utility scripts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["click>=8.1.0", "orjson>=3.11.7", "requests>=2.32.5"]

[project.scripts]
jellyfin-watched = "jellyfin_utils.watched:main"
jellyfin-stale = "jellyfin_utils.stale:main"

[tool.uv]
package = true

[dependency-groups]
dev = [{ include-group = "lint" }, { include-group = "typing" }]
lint = ["ruff>=0.11.10"]
typing = [
  "ty>=0.0.14",
  "types-requests>=2.31.0",
  "types-python-dateutil>=2.8.19",
]

[tool.ty.rules]
possibly-missing-import = "error"
unused-ignore-comment = "warn"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",
  "D203",   # 1 blank line required before class docstring
  "D205",   # 1 blank line required between summary line and description
  "D212",   # Multi-line docstring summary should start at the first line
  "FIX002", # Line contains TODO, consider resolving or converting to issue
  "PLR0913", # Too many arguments — CLI output helpers need context params
  "TD003",  # Missing issue link on TODO comment
  "TRY003", # Avoid specifying long messages outside exception class - acceptable for CLI
]

[tool.ruff.lint.isort]
combine-as-imports = true
