[project]
name            = "jellyfin-utils"
version         = "0.1.0"
description     = "Jellyfin utility scripts"
readme          = "README.md"
requires-python = ">=3.12"
license         = "Apache-2.0"
license-files   = ["LICENSE", "NOTICE"]
authors         = [{ name = "Cian Butler", email = "butlerx@notthe.cloud" }]
keywords        = ["cli", "jellyfin", "jellyseerr", "media-server"]
classifiers     = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
  "Topic :: System :: Systems Administration",
]
dependencies    = ["click>=8.4.2", "orjson>=3.11.9", "requests>=2.34.2"]

[project.urls]
Homepage = "https://github.com/butlerx/jellyfin-utils"
Issues   = "https://github.com/butlerx/jellyfin-utils/issues"

[project.scripts]
jellyfin = "jellyfin_utils.cli:cli"

[dependency-groups]
dev    = [{ include-group = "lint" }, { include-group = "typing" }]
lint   = ["ruff>=0.16.1"]
typing = [
  "ty>=0.0.69",
  "types-python-dateutil>=2.8.19",
  "types-requests>=2.33.0.20260712",
]

[build-system]
# PEP 639 `license` / `license-files` need setuptools 77 or newer.
requires      = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",
  "CPY001",       # Missing copyright notice at top of file — Apache-2.0 headers live in LICENSE/NOTICE only
  "D203",         # 1 blank line required before class docstring
  "D205",         # 1 blank line required between summary line and description
  "D212",         # Multi-line docstring summary should start at the first line
  "FIX002",       # Line contains TODO, consider resolving or converting to issue
  "PLR0913",      # Too many arguments — CLI output helpers need context params
  "PLR0917",      # Too many positional arguments — same, Click passes each option through
  "TD003",        # Missing issue link on TODO comment
  "TRY003",       # Avoid specifying long messages outside exception class - acceptable for CLI
]

[tool.ruff.lint.per-file-ignores]
# Click turns `is_flag` options into positional booleans and passes decorators around untyped.
"**/cli.py" = [
  "ANN401",      # Dynamically typed expressions (typing.Any) — shared option decorators
  "FBT001",      # Boolean-typed positional argument — how Click passes --flag values
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ty.rules]
possibly-missing-import = "error"
unused-ignore-comment   = "warn"

[tool.uv]
package = true
