version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Match the 7-day cooldown the pre-commit config uses for its own updates.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'build'
      prefix-development: 'chore'
    groups:
      requests:
        patterns:
          - 'requests'
          - 'types-requests'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci'
