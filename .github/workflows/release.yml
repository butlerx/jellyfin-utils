name: Release

on:
  push:
    tags:
      - v*
  # Lets a release be rehearsed against TestPyPI before a real tag is cut.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # The cache is writable from any branch, so a release build must not
          # read from it (cache poisoning).
          enable-cache: false
      # A tag that disagrees with `project.version` would publish under the wrong
      # version number, and PyPI never lets that filename be reused.
      - name: Check the tag matches project.version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GIT_TAG: ${{ github.ref_name }}
        run: |
          version="$(uv version --short)"
          if [ "$GIT_TAG" != "v${version}" ]; then
            echo "tag ${GIT_TAG} does not match pyproject version ${version}" >&2
            exit 1
          fi
      - run: uv build
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Trusted publishing: PyPI verifies this job's OIDC token against the publisher
  # configured for the project, so there is no API token to store or rotate. The
  # `environment` name is part of what PyPI checks, so it must match the
  # publisher config exactly.
  publish-testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GIT_TAG: ${{ github.ref_name }}
        run: gh release create "$GIT_TAG" dist/* --generate-notes --verify-tag
